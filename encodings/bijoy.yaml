# Bijoy (ANSI) to Unicode mapping for Bengali.
#
# Bijoy-encoded text stores Bengali as Latin/Windows-1252 code points and
# relies on fonts such as SutonnyMJ to draw the right glyphs. This file maps
# those code points back to Unicode Bengali. The converter applies the
# longest matching key first, collapses doubled viramas (a half-form glyph
# and a phala glyph each carry one), then runs the reorder rules, then
# normalises to NFC (which composes two-part vowel signs such as
# e-kar + aa-kar -> o-kar).
#
# Known gaps (see the project roadmap): only the precomposed conjunct glyphs
# exercised by the golden tests are mapped so far. The rarer upper-ANSI
# conjunct glyphs are not mapped yet and pass through unchanged.

id: bijoy
name: "Bijoy (SutonnyMJ and compatible fonts)"
script: "Bengali"
language: "bn"
fonts: ["SutonnyMJ", "SutonnyOMJ"]
status: "in-progress"

mappings:
  # Independent vowels. "Av" must map as a unit: "A" is the vowel letter and
  # "v" the aa-sign, but together they form the independent letter "আ".
  "Av": "আ"
  "A": "অ"
  "B": "ই"
  "C": "ঈ"
  "D": "উ"
  "E": "ঊ"
  "F": "ঋ"
  "G": "এ"
  "H": "ঐ"
  "I": "ও"
  "J": "ঔ"

  # Consonants.
  "K": "ক"
  "L": "খ"
  "M": "গ"
  "N": "ঘ"
  "O": "ঙ"
  "P": "চ"
  "Q": "ছ"
  "R": "জ"
  "S": "ঝ"
  "T": "ঞ"
  "U": "ট"
  "V": "ঠ"
  "W": "ড"
  "X": "ঢ"
  "Y": "ণ"
  "Z": "ত"
  "_": "থ"
  "`": "দ"
  "a": "ধ"
  "b": "ন"
  "c": "প"
  "d": "ফ"
  "e": "ব"
  "f": "ভ"
  "g": "ম"
  "h": "য"
  "i": "র"
  "j": "ল"
  "k": "শ"
  "l": "ষ"
  "m": "স"
  "n": "হ"
  "o": "ড়"
  "p": "ঢ়"
  "q": "য়"
  "r": "ৎ"

  # Signs.
  "s": "ং"
  "t": "ঃ"
  "u": "ঁ"

  # Dependent vowel signs. "†"/"‡" (e-kar) and "ˆ" (oi-kar) are typed before
  # the consonant in Bijoy; the reorder rule below moves them after it.
  # "Š" is the right half of o-kar/au-kar; NFC composes e-kar + "ৗ" into
  # au-kar and e-kar + aa-kar into o-kar.
  "v": "া"
  "w": "ি"
  "x": "ী"
  "y": "ু"
  "z": "ু"
  "ƒ": "ূ"
  "~": "ূ"
  "„": "ৃ"
  "†": "ে"
  "‡": "ে"
  "ˆ": "ৈ"
  "‰": "ৈ"
  "Š": "ৗ"

  # Contextual glyphs: consonant + u-kar/ri-kar drawn as one glyph.
  "¸": "গু"
  "ï": "শু"
  "û": "হু"
  "ü": "হৃ"

  # Precomposed conjunct glyphs from the upper ANSI range. Full conjuncts map
  # to the whole cluster. Half forms (left/top part) end with a virama and
  # phala forms (bottom part) start with one; when a half form meets a phala
  # form the converter collapses the doubled virama, so both "¤ú" (half form
  # + phala) and "¤c" (half form + full consonant) yield the same cluster.
  "³": "ক্ত"
  "Ü": "ন্ধ"
  "ó": "ষ্ট"
  "›": "ন্"
  "¤": "ম্"
  "¯": "স্"
  "‹": "্ক"
  "ú": "্প"
  "^": "্ব"
  "¥": "্ম"

  # Reph: in Bijoy the reph glyph is usually typed after the consonant it
  # sits above; the "reph" reorder rule below moves it before that cluster.
  "©": "র্"

  # Joining marks. In a Bijoy font the bare "&" renders as the hasanta, so it
  # maps to the virama; write "\&" for a literal ampersand.
  "¨": "্য"
  "Ö": "্র"
  "ª": "্র"
  "&": "্"
  "\\&": "&"

  # Digits and punctuation. The bare "|" renders as the danda; write "\|"
  # for a literal pipe.
  "0": "০"
  "1": "১"
  "2": "২"
  "3": "৩"
  "4": "৪"
  "5": "৫"
  "6": "৬"
  "7": "৭"
  "8": "৮"
  "9": "৯"
  "|": "।"
  "\\|": "|"

reorder:
  # Visual order -> logical order. The reph is typed after the consonant it
  # belongs before; it must move first so that a pre-base sign typed before
  # the same consonant still finds the full cluster.
  - type: "reph"
    signs: ["র্"]
  - type: "pre-base-vowel-sign"
    signs: ["ি", "ে", "ৈ"]
  # Candrabindu is typed before the vowel sign it must follow in Unicode.
  - type: "sign-after-vowel-sign"
    signs: ["ঁ"]
